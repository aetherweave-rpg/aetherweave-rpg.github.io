<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aetherweave — Talent Trees</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="page page-trees">
    <!-- No PDF export here: a talent tree is a screen artifact (a wide grid with
         an SVG line overlay) and never printed well. The character sheet is the
         page that has a paper form — see sheet.html / js/print-sheet.js. -->
    <div id="tree-tabs" class="tree-tabs"></div>
    <div id="tree" class="tree"></div>

    <div class="legend">
      <span class="legend-title">How to read the tree</span>
      <span class="legend-item"><span class="swatch node-available"></span> Available — click to learn</span>
      <span class="legend-item"><span class="swatch node-owned"></span> Learned (✓)</span>
      <span class="legend-item"><span class="swatch node-granted"></span> Granted at creation (★) — free</span>
      <span class="legend-item"><span class="swatch node-locked"></span> Locked — requirements unmet</span>
      <span class="legend-item"><span class="swatch node-invalid"></span> Learned but now invalid</span>
      <span class="legend-item"><span class="line-swatch"></span> Prerequisite link (dashed = any-of)</span>
      <span class="legend-item">Horizontal dividers separate tiers of play. Hover a talent for its requirements.</span>
    </div>
  </main>

  <!-- ---------- Editable database (all content is in these files) ---------- -->
  <script src="js/data/creation.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data/skills.js"></script>
  <script src="js/data/domains.js"></script>
  <script src="js/data/ancestries.js"></script>
  <script src="js/data/combinations.js"></script>
  <script src="js/data/sources.js"></script>
  <script src="js/data/spells.js"></script>

  <!-- ---------- Application ---------- -->
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui-shared.js"></script>
  <script src="js/tree.js"></script>
</body>
</html>
