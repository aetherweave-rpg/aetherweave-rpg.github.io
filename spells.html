<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aetherweave — Spells</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="page page-spells">
    <!-- A reading reference, not a place to spend exp: spells are nodes in
         their domain's talent tree now (index.html), which is where their
         prerequisites are visible. The character sheet is the page with a
         paper form — see sheet.html / js/print-sheet.js. -->
    <div id="spell-tabs" class="tree-tabs"></div>
    <div id="spell-reference" class="spell-reference"></div>

    <div class="legend">
      <span class="legend-title">How to read this</span>
      <span class="legend-item"><span class="spell-status-tag known">Known</span> Learned</span>
      <span class="legend-item"><span class="spell-status-tag learnable">Can learn</span> Requirements met</span>
      <span class="legend-item"><span class="spell-status-tag locked">Locked</span> Requirements unmet</span>
      <span class="legend-item">A spell's tier is the Spellcasting proficiency it needs. Mana to cast is tier − 1, so tier 1 is a free cantrip.</span>
      <span class="legend-item">Click a spell for its rules text.</span>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <!-- ---------- Editable database (all content is in these files) ---------- -->
  <script src="js/data/creation.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data/skills.js"></script>
  <script src="js/data/domains.js"></script>
  <script src="js/data/ancestries.js"></script>
  <script src="js/data/combinations.js"></script>
  <script src="js/data/sources.js"></script>
  <script src="js/data/spells.js"></script>

  <!-- ---------- Application ---------- -->
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui-shared.js"></script>
  <script src="js/spells.js"></script>
</body>
</html>
